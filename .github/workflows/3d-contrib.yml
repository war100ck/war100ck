name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: war100ck

      # Кастомизация: прозрачный фон + неоновый синий текст (Python — надёжнее sed)
      - name: Customize 3D SVG colors
        run: |
          python3 << 'PYEOF'
          import os
          import re

          # Цвета для замены
          bg_colors = ['#0d1117', '#161b22', '#000000', '#000', '#010409', '#21262d']
          text_colors = ['#ffffff', '#fff', '#c9d1d9', '#e6edf3', '#f0f6fc', '#8b949e']

          for filename in os.listdir('profile-3d-contrib'):
              if not filename.endswith('.svg'):
                  continue
              filepath = os.path.join('profile-3d-contrib', filename)
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              # Заменяем фоновые цвета на прозрачный
              for color in bg_colors:
                  content = content.replace(f'fill="{color}"', 'fill="none"')
                  content = content.replace(f'fill:{color}', 'fill:none')
                  content = content.replace(f'fill: {color}', 'fill: none')

              # Заменяем текстовые цвета на неоновый синий
              for color in text_colors:
                  content = content.replace(f'fill="{color}"', 'fill="#0078D6"')
                  content = content.replace(f'fill:{color}', 'fill:#0078D6')
                  content = content.replace(f'fill: {color}', 'fill: #0078D6')

              # Убираем background в style тегах
              content = re.sub(r'background(?:-color)?:\s*#[0-9a-fA-F]{3,8}', '', content)
              content = re.sub(r'background(?:-color)?="[^"]*"', '', content)

              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content)

              print(f"Processed: {filename}")
          PYEOF

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated" || echo "No changes"
          git push
