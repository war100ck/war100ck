name: Generate GitHub Readme Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/github-stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow
          config_display: large
          plugin_lines: yes
          plugin_traffic: yes
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_days: 14
          plugin_topics: yes
          plugin_topics_limit: 8
          plugin_topics_mode: icons
          config_twemoji: yes

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/github-top-langs.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          config_display: large

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/github-streak.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Europe/Moscow
          config_display: large

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/github-activity.svg
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_display: large

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/
          git stash || true
          git pull --rebase origin main || git pull origin main || true
          git stash pop || true
          git add assets/
          git commit -m "Update GitHub stats cards" || echo "No changes"
          git push origin main
