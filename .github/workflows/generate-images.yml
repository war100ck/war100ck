name: Generate Profile Images

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: mkdir -p assets

      # 1. GitHub Stats (sigma-five — более стабильное зеркало)
      - name: Download GitHub Stats
        run: |
          curl -sL --retry 3 --max-time 30             "https://github-readme-stats-sigma-five.vercel.app/api?username=war100ck&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=0078D6&icon_color=0078D6&text_color=c9d1d9&rank_icon=github&border_radius=10&cache_seconds=86400"             > assets/stats.svg || true
          if [ ! -s assets/stats.svg ] || grep -qi "error\|unexpected\|something went wrong\|maximum retries" assets/stats.svg; then
            echo "Stats download failed, keeping old file"
            git checkout assets/stats.svg 2>/dev/null || true
          fi

      # 2. Top Languages (sigma-five)
      - name: Download Top Languages
        run: |
          curl -sL --retry 3 --max-time 30             "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=war100ck&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=0078D6&text_color=c9d1d9&langs_count=8&border_radius=10&cache_seconds=86400"             > assets/top-langs.svg || true
          if [ ! -s assets/top-langs.svg ] || grep -qi "error\|unexpected\|something went wrong\|maximum retries" assets/top-langs.svg; then
            echo "Top langs download failed, keeping old file"
            git checkout assets/top-langs.svg 2>/dev/null || true
          fi

      # 3. Streak Stats
      - name: Download Streak Stats
        run: |
          curl -sL --retry 3 --max-time 30             "https://streak-stats.demolab.com?user=war100ck&theme=tokyonight&hide_border=true&background=0D1117&stroke=0078D6&ring=0078D6&fire=FF6B00&currStreakNum=C9D1D9&sideNums=C9D1D9&currStreakLabel=0078D6&sideLabels=C9D1D9"             > assets/streak.svg || true
          if [ ! -s assets/streak.svg ] || grep -qi "error\|unexpected\|something went wrong" assets/streak.svg; then
            echo "Streak download failed, keeping old file"
            git checkout assets/streak.svg 2>/dev/null || true
          fi

      # 4. Activity Graph
      - name: Download Activity Graph
        run: |
          curl -sL --retry 3 --max-time 30             "https://github-readme-activity-graph.vercel.app/graph?username=war100ck&theme=tokyo-night&hide_border=true&bg_color=0d1117&color=0078D6&line=0078D6&point=FF6B00&area=true"             > assets/activity.svg || true
          if [ ! -s assets/activity.svg ] || grep -qi "error\|unexpected\|something went wrong" assets/activity.svg; then
            echo "Activity graph download failed, keeping old file"
            git checkout assets/activity.svg 2>/dev/null || true
          fi

      # 5. Commit & Push с git pull
      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/
          git stash || true
          git pull --rebase origin main || git pull origin main || true
          git stash pop || true
          git add assets/
          git commit -m "Update profile images" || echo "No changes"
          git push origin main
