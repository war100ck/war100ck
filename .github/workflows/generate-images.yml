name: Generate Profile Images

on:
  schedule:
    - cron: "0 0 * * *"  # Каждый день в полночь
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p assets

      # 1. GitHub Stats (100% надежно — через GitHub API напрямую)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow

      # 2. Top Languages (через GitHub API напрямую)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/top-langs.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # 3. Isocalendar — тепловая карта активности (замена Activity Graph)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 4. Habits — часы активности
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Europe/Moscow

      # 5. Streak Stats — скачиваем SVG (с fallback)
      - name: Download Streak Stats
        run: |
          curl -sL --retry 3 --max-time 30             "https://streak-stats.demolab.com?user=war100ck&theme=tokyonight&hide_border=true&background=0D1117&stroke=0078D6&ring=0078D6&fire=FF6B00&currStreakNum=C9D1D9&sideNums=C9D1D9&currStreakLabel=0078D6&sideLabels=C9D1D9"             > assets/streak.svg || echo "Streak download failed, keeping old file"
          # Проверяем, что файл не пустой и не содержит ошибку
          if [ ! -s assets/streak.svg ] || grep -q "error\|Error\|ERROR" assets/streak.svg; then
            echo "Streak SVG invalid, restoring from git"
            git checkout assets/streak.svg || true
          fi

      # 6. Activity Graph — скачиваем SVG (с fallback)
      - name: Download Activity Graph
        run: |
          curl -sL --retry 3 --max-time 30             "https://github-readme-activity-graph.vercel.app/graph?username=war100ck&theme=tokyo-night&hide_border=true&bg_color=0d1117&color=0078D6&line=0078D6&point=FF6B00&area=true"             > assets/activity.svg || echo "Activity graph download failed, keeping old file"
          if [ ! -s assets/activity.svg ] || grep -q "error\|Error\|ERROR" assets/activity.svg; then
            echo "Activity SVG invalid, restoring from git"
            git checkout assets/activity.svg || true
          fi

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/
          git commit -m "Update profile images" || echo "No changes"
          git push
