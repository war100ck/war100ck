name: Generate Profile Images

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: mkdir -p assets

      # 1. GitHub Stats
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow

      # 2. Top Languages
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/top-langs.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # 3. Isocalendar — тепловая карта
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 4. Streak Stats — скачиваем с fallback
      - name: Download Streak Stats
        run: |
          curl -sL --retry 3 --max-time 30             "https://streak-stats.demolab.com?user=war100ck&theme=tokyonight&hide_border=true&background=0D1117&stroke=0078D6&ring=0078D6&fire=FF6B00&currStreakNum=C9D1D9&sideNums=C9D1D9&currStreakLabel=0078D6&sideLabels=C9D1D9"             > assets/streak.svg || true
          if [ ! -s assets/streak.svg ] || grep -qi "error\|unexpected" assets/streak.svg; then
            git checkout assets/streak.svg 2>/dev/null || true
          fi

      # 5. Activity Graph — скачиваем с fallback
      - name: Download Activity Graph
        run: |
          curl -sL --retry 3 --max-time 30             "https://github-readme-activity-graph.vercel.app/graph?username=war100ck&theme=tokyo-night&hide_border=true&bg_color=0d1117&color=0078D6&line=0078D6&point=FF6B00&area=true"             > assets/activity.svg || true
          if [ ! -s assets/activity.svg ] || grep -qi "error\|unexpected" assets/activity.svg; then
            git checkout assets/activity.svg 2>/dev/null || true
          fi

      # 6. Commit & Push с git pull (чтобы не было конфликтов)
      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/
          git stash || true
          git pull --rebase origin main || git pull origin main || true
          git stash pop || true
          git add assets/
          git commit -m "Update profile images" || echo "No changes"
          git push origin main
